[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprise"
version = "0.1.0"
description = "Deterministic record/replay and time-travel debugging for AI agents. Local-first, MCP-native."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shreyas Bhardwaj" }]
keywords = [
    "ai-agents", "llm", "observability", "debugging",
    "record-replay", "time-travel", "mcp", "ollama", "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
reprise = "reprise.cli:main"

# TODO: set to the real repo URL once the GitHub org/username is decided.
[project.urls]
Homepage = "https://github.com/OWNER/reprise"
Repository = "https://github.com/OWNER/reprise"

[tool.hatch.build.targets.wheel]
packages = ["src/reprise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
